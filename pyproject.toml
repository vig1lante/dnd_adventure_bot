# Виртуальный корень uv workspace: сам не пакет и без секции [project].
# Так `uv sync` и `uv run` из корня ставят все пакеты workspace (engine и server);
# с [project] и package = false они бы ставили только зависимости корня.
[tool.uv.workspace]
members = ["services/engine", "services/server"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-xdist>=3.8", "ruff>=0.7"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["services/webapp", "loop-engineering"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Код, комментарии и тексты проекта русские. Ruff считает эти 23 русские буквы «похожими на
# латинские» и ругается на нормальные русские слова (RUF001–003). Разрешаем их, а правила не
# отключаем: подмена на греческие и прочие двойники, полноширинные цифры и невидимые
# разделители по-прежнему ловятся. Знаки «–», «−», «×» — обычная типографика в русских текстах.
allowed-confusables = [
    "А", "В", "Е", "З", "К", "М", "Н", "О", "Р", "С", "Т", "У", "Х", "Ь",
    "а", "б", "г", "е", "о", "р", "с", "у", "х",
    "–", "−", "×",
]

[tool.ruff.lint.isort]
# Пакеты workspace лежат в services/*/src; без этого Ruff считает их сторонними
# и сливает в один блок с sqlalchemy, fastapi и pydantic.
known-first-party = ["dnd_engine", "dnd_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Тесты идут параллельно на всех ядрах (pytest-xdist); `-n 0` — в одном процессе, для отладки.
addopts = "-n auto --dist worksteal"
testpaths = ["services/engine/tests", "services/server/tests"]
