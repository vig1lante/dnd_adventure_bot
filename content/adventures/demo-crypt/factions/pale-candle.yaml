id: pale-candle
name: Общество бледной свечи
goal: Собирать взносы с начинающих некромантов.
methods: Письма, брошюры и обещания скорого могущества.
secret: >-
  Общество — шайка мошенников. Ритуал из их брошюры переврал старую молитву Оссмару, поэтому
  руны в меловом круге Фабиана и вышли кривыми.
public: Общество, которое рассылает по почте книги по некромантии.
