id: risen-bones
location_id: cemetery
trigger: >-
  Отряд идёт дальше ворот или шумит у сторожки: остатки ритуала поднимают мертвецов из
  ближних могил.
tactics: >-
  Скелеты бросаются к ближайшему герою и бьют издали из луков, если их не достать.
  Зомби медленно бредут от сторожки к героям и не отступают. Нежить сражается, пока не разрушена.
monsters:
  - monster_id: skeleton
    count: 3
    zone: graves
  - monster_id: zombie
    count: 2
    zone: lodge
pc_zone: gate
