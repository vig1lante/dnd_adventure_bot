id: fabian-fight
location_id: crypt
trigger: >-
  Переговоры с Фабианом сорваны, или отряд сразу идёт на него: он грозит заклинаниями и
  просит ещё минуточку на подготовку.
tactics: >-
  Фабиан держится за скелетами у алтаря, а к тем, кто подошёл вплотную, бьёт Клинком
  договора. Заклинания у него больше для вида. Когда его здоровье падает ниже трети, он
  пытается торговаться и предлагает вместо боя расписку. Скелеты сражаются, пока не
  разрушены; если Фабиан сдаётся или падает, оставшиеся скелеты рассыпаются, и бой
  заканчивается.
monsters:
  - monster_id: cultist_fanatic
    count: 1
    zone: altar
  - monster_id: skeleton
    count: 2
    zone: hall
pc_zone: stairs
