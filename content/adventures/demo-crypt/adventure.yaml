format_version: 2
id: demo-crypt
title: Склеп должника
pitch: >-
  В деревне Мшистый Брод пропал смотритель кладбища Ульрих, а мертвецы на холме
  вдруг перестали лежать смирно. Его сестра Марта, хозяйка трактира «Сонный
  покойник», ищет смельчаков. Заодно она ищет одного неудачника, который
  задолжал ей сорок золотых и как раз сейчас куда-то запропастился.
journal_intro: >-
  Пропал смотритель кладбища Ульрих, а мертвецы на холме перестали лежать смирно. Его сестра
  Марта, хозяйка трактира «Сонный покойник», просит отряд найти брата.
tone: готика с юмором
# Рассчитано на 1–1,5 часа живой игры. Оценка валидатора (116 минут) выше: формула считает
# полные 30 минут на каждый бой, а оба боя здесь короткие.
target_hours: 1.5
party_level: 3
party_size: 6
rules:
  base: srd-5.2
  modules:
    - bg3_flavor
    - campfire
start_location: village
finale_location: crypt
villain: npc:fabian
acts:
  - id: act-1
    title: Тревога в «Сонном покойнике»
    summary: >-
      Отряд приходит в Мшистый Брод под вечер. Деревня заперла ставни, а в трактире
      хозяйка Марта рассказывает, что брат ушёл на обход кладбища три ночи назад и не
      вернулся. Марта просит отряд проверить кладбище. Запасной ключ от сундука в сторожке
      она отдаёт, когда убеждается, что отряд всерьёз идёт искать брата на кладбище.
    key_scenes:
      - Объявление о пропавшем смотрителе на доске у трактира.
      - Разговор с Мартой о брате и о ссоре с должником.
      - Марта отдаёт запасной ключ от сундука в сторожке.
  - id: act-2
    title: Кости не спят
    summary: >-
      На кладбище туман и неприветливые покойники. В сторожке смотрителя лежит дневник
      с записями о Фабиане, а в запертом сундуке хранится зелье лечения. Следы
      волочения ведут к мшистой плите у дальней стены, под которой начинается
      лестница в склеп.
    key_scenes:
      - Бой «Встающие кости» у ворот и среди могил.
      - Осмотр сторожки, где лежит дневник смотрителя и стоит сундук с замком.
      - Следы волочения и поиск скрытого входа под плитой.
      - Привал у костра перед спуском в склеп.
  - id: act-3
    title: Склеп должника
    summary: >-
      В склепе графа Мортена некромант-неудачник Фабиан держит смотрителя «консультантом»
      по ритуалу, которым надеется добыть клад и рассчитаться с Мартой. Скелеты в зале
      подчиняются Фабиану, а сам ритуал держится на меловом круге с ошибками в рунах.
      Фабиана можно победить, пристыдить или уговорить отработать долг.
    key_scenes:
      - Спуск в склеп и меловой круг с ошибками в рунах.
      - Разговор с Фабианом, который оправдывается, торгуется и грозит заклинаниями.
      - Бой с Фабианом и скелетами.
      - Освобождение Ульриха из саркофага.
endings:
  - >-
    Ульрих спасён, Фабиан повержен. Марта ставит отряду бочку пива и вешает счёт
    Фабиана над стойкой в рамке.
  - >-
    Фабиан сдаётся и соглашается отработать долг на кухне трактира. Ульрих возвращается
    на пост, и мертвецы снова лежат смирно.
  - >-
    Фабиан сбегает, бросив ритуал. Отряд выводит Ульриха, но долг остаётся невозвращённым,
    а у Марты появляется личный враг вместо должника.
  - >-
    Ритуал вышел из-под контроля, и отряд опоздал. Марте приносят не брата, а его
    дневник и зелье, которое он берёг на чёрный день.
