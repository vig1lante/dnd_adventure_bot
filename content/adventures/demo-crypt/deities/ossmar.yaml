id: ossmar
name: Оссмар
title: Сторож могил
domains:
  - смерть
  - покой
symbol: железный ключ на цепи
dogma: Мёртвым — покой, живым — память.
appearance: Высокий старик с фонарём и связкой ключей на поясе.
attitude_to_mortals: Строг, но справедлив; не прощает тех, кто тревожит мёртвых ради наживы.
secret: >-
  Смотритель Ульрих по обету служит Оссмару. Пока он на посту, мёртвые на холме спят крепко и
  встают только от чужой ворожбы, как от ритуала Фабиана.
public: Бог покоя мёртвых; кладбища в краю ставят под его ключ.
known_at_start: true
