- id: kidnapper
  statement: >-
    Смотрителя Ульриха похитил Фабиан ради долга: ему нужен клад графа Мортена, чтобы
    рассчитаться с Мартой.
  clues:
    - id: clue-diary
      description: >-
        Дневник Ульриха: Фабиан просил показать, как поднимается плита графа Мортена, и
        обещал вернуться с аргументами.
      where: feature:diary
    - id: clue-marta
      description: >-
        Марта рассказывает, что Фабиан задолжал ей сорок золотых, хвастался скорым
        возвратом и исчез в ту же ночь, что и Ульрих.
      where: npc:marta
    - id: clue-tracks
      description: >-
        Следы волочения и стоптанные каблуки ведут от сторожки к мшистой плите у дальней
        стены кладбища.
      where: feature:tracks
