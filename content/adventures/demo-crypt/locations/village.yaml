id: village
name: Мшистый Брод
region: Болотистый край, окраина
read_aloud: >-
  Вечерний Мшистый Брод встречает вас закрытыми ставнями и одним освещённым окном:
  это трактир «Сонный покойник». На столбе у входа белеют бумажки, а с холма за
  деревней тянет сырой землёй. Кажется, будто кладбище слушает, о чём вы здесь
  разговариваете.
dm_notes: >-
  Боёв в деревне нет. Марта охотнее рассказывает о брате тем, кто сел за стол и заказал
  ужин. Запасной ключ от сундука в сторожке она отдаёт, когда убеждается, что отряд всерьёз
  идёт искать брата на кладбище. Жители боятся говорить о смотрителе вслух: считают, что
  покойники слышат.
exits:
  - id: to-cemetery
    to: cemetery
    direction: север
    description: Тропа через мокрый холм к кладбищу.
features:
  - id: board
    name: Доска объявлений
    description: >-
      На доске у входа в трактир висят три объявления: «Куплю козу, дорого», «Пропал
      смотритель кладбища Ульрих; нашедшему обещан ужин и пятьдесят золотых» и записка
      чужим почерком: «Если спросят про меня кредиторы, я уехал на юг».
public: Деревня у болота, где горит окно трактира «Сонный покойник».
known_at_start: true
