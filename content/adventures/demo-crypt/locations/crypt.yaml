id: crypt
name: Склеп графа Мортена
region: Под кладбищем
read_aloud: >-
  Лестница выводит в сырой зал, где рядами стоят каменные саркофаги. Посередине мелом
  начерчен круг с кривыми рунами, над ним поднимается зелёная дымка, а на стене висит
  табличка: «Ритуал в процессе. Извините за неудобства. Ф.». Из-за дальнего саркофага у
  алтаря доносится приглушённый голос: «Фабиан, это читается не так!»
dm_notes: >-
  Финал. Фабиан не злодей по призванию, а должник, дошедший до крайности. Его можно
  уговорить сдаться: Харизма (Убеждение) Сл 15, особенно если отряд упомянет Марту. Если
  уговоры сорваны или Фабиана напугали, начинается бой. Скелеты сражаются, пока не
  разрушены; если Фабиан сдаётся или падает, оставшиеся скелеты рассыпаются, и бой
  заканчивается. Меловой круг — часть ритуала: руны можно поправить, но на скелетов это не
  влияет. Ульрих жив и сидит в саркофаге у алтаря: кормят его хорошо, но разговорами
  замучили. Клада графа в склепе, скорее всего, нет вовсе.
exits:
  - id: to-cemetery
    to: cemetery
    direction: вверх
    description: Каменная лестница наверх, к мшистой плите.
features:
  - id: ritual-circle
    name: Меловой круг
    description: >-
      Круг начерчен мелом, и руны в нём нарисованы с ошибками: одна выглядит как
      зачёркнутая буква, другая как смешной зверёк. Из середины поднимается зелёная
      дымка. Тот, кто разбирается в магии, может поправить пару рун и сорвать ритуал.
    check:
      ability: int
      skill: arcana
      dc: 15
    reveals:
      - kind: flag
        id: circle-broken
  - id: sarcophagus
    name: Саркофаг смотрителя
    description: >-
      Крышка ближнего к алтарю саркофага сдвинута. Внутри на подушке из старого плаща
      сидит измождённый, но живой Ульрих. На коленях у него надкушенная краюха хлеба, на
      лице усталое терпение человека, который всю ночь исправлял чужие ошибки.
secrets:
  - id: empty-treasury
    text: >-
      Казну графа Мортена вынесли ещё его наследники. Тайник под алтарём пуст, на дне лежит
      только записка: «Простите, папенька, долги».
    check:
      ability: int
      skill: investigation
      dc: 15
    reveals:
      - kind: flag
        id: treasury-empty
encounter_id: fabian-fight
zones:
  - id: stairs
    name: у лестницы
  - id: hall
    name: зал саркофагов
  - id: altar
    name: у алтаря
links:
  - a: stairs
    b: hall
    distance: near
  - a: hall
    b: altar
    distance: near
public: Старый склеп графа Мортена под кладбищем.
