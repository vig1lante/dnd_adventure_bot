# Пример пожеланий для `dnd-generate --wishes` (README, раздел «Генерация приключения»).
#
# Формат — «шаг: текст». Шаги: concept, world, pantheon, factions, plot, locations,
# location_contents, npcs, relations, encounters, items, clues. Текст — от 1 до 2000 знаков.
# Неизвестный шаг, пустой или слишком длинный текст — отказ с кодом 2 ещё до вызова модели.
#
# Пожелание попадает в промпт только своего шага, отдельным блоком данных: для модели это
# материал, а не команда. Пожелание к шагу, закреплённому заготовками (world или plot из --seeds),
# не используется: такой шаг не запускается.
#
# Пример подходит к сценарию services/server/tests/scenarios/generator_v2_demo.yaml и заготовкам
# content/examples/seeds_v2.yaml. FakeProvider отвечает по сценарию и пожелания не читает: с ним
# видно только, что файл прошёл проверку.
concept: >-
  Морская готика с мрачным юмором на один вечер. Маяк погас не сам, и отряд должен понять, кто
  в этом виноват.
factions: Пусть кроме артели будут контрабандисты, которым тёмный маяк выгоден.
npcs: >-
  Главный злодей — жрец забытого бога, который сам когда-то выжил в кораблекрушении. Остальные
  NPC — простые люди гавани, у каждого своя выгода.
location_contents: В каждой комнате маяка должно быть что осмотреть, а в комнатах смотрителя — тайник.
encounters: Финальный бой — с боссом у алтаря в фонарной; по дороге — одна засада на тропе.
