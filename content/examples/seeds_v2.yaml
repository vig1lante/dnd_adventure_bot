# Пример заготовок для `dnd-generate --seeds` (README, раздел «Генерация приключения»).
#
# Заготовка — то, что автор задал сам. Генератор строит остальное вокруг неё, а заданное не меняет:
# ответ модели для закреплённого id сервер отбрасывает. Разделы пишутся в том же формате, что и
# файлы папки приключения v2 (README, «Формат приключения v2»): world, deities, factions, plot,
# locations, npcs, relations, encounters, monsters, items, revelations. Любой раздел можно опустить.
#
# Сущность раздела-списка закрепляется по своему id (npc:ilsa, deity:selmara…). Мир (world) и сюжет
# (plot) закрепляются целиком: их шаг не запускается, и модель их не дописывает.
#
# Пример подходит к сценарию FakeProvider services/server/tests/scenarios/generator_v2_demo.yaml
# («Маяк на Вороньем мысу»): ссылки ведут на его id — локации harbor, cliff-path, lighthouse,
# lamp-room и NPC ilsa, bram, veran. Тексты нарочно отличаются от ответов сценария: в готовой
# папке видно, что закреплённое осталось таким, как в этом файле.

# Мир целиком: шаг world не запускается.
world:
  history: >-
    Вороний мыс выдаётся в море дальше всех скал побережья. Триста лет назад рыбаки поставили на
    нём маяк и посвятили огонь Сельмаре. До маяка на вершине жгли костры, но кому — в гавани
    вспоминать не любят.
  regions:
    - id: crow-cape
      name: Вороний мыс
      description: Голые скалы, рыбацкая гавань у подножия и маяк на вершине.
      public: Скалы с гаванью внизу и маяком наверху.
      known_at_start: true
  rumors:
    # Ключ 'true' — правдив ли слух; это знает только мастер.
    - text: Смотритель маяка запил и сам погасил огонь.
      'true': false
      known_at_start: true
    - text: В фонарной кто-то молится, но не Сельмаре.
      'true': true

deities:
  - id: selmara
    name: Сельмара
    title: Хозяйка приливов
    domains: [море, возвращение домой]
    symbol: Перламутровая раковина с огоньком внутри.
    dogma: Кто держит огонь для чужих кораблей, тот и сам вернётся домой.
    appearance: Женщина в мокром плаще, в руке фонарь из перламутра.
    attitude_to_mortals: Бережёт моряков и смотрителей, не прощает тех, кто грабит тонущих.
    public: Богиня моря и маяков, ей молятся рыбаки.
    known_at_start: true

# Новой фракции нет в ответах сценария: шаг factions добавит свои фракции рядом с ней.
factions:
  - id: fishers-guild
    name: Рыбацкая артель
    goal: Вернуть огонь на маяк, пока гавань не осталась без кораблей.
    methods: Общая касса, лодки в долг и круговая порука.
    leader: npc:ilsa
    base_location: harbor
    attitude_to_party: 1
    public: Рыбаки гавани, которые держатся друг за друга.
    known_at_start: true

npcs:
  - id: ilsa
    name: Ильза
    role: начальница гавани и старшина артели
    appearance: Высокая, в штормовке с чужого плеча, на поясе связка ключей от причалов.
    manner: Говорит прямо и громко, перебивает, а когда нервничает — смеётся.
    motive: Зажечь маяк и доказать артели, что она не зря стала старшиной.
    secret: Смотритель просил у неё помощи за день до того, как пропал, а она отмахнулась.
    knows:
      - Смотритель Тобиас пропал неделю назад.
      - На тропе к маяку по ночам видели людей в сером.
    attitude: 1
    location_id: harbor
    public: Начальница гавани, она наняла отряд.
    known_at_start: true

# Связи общего графа. Связи NPC можно писать и в старой форме внутри NPC
# (relations: [{npc_id, kind, note}]): при чтении заготовок они перейдут сюда.
relations:
  - id: ilsa-worships-selmara
    a: npc:ilsa
    b: deity:selmara
    kind: worships
    note: Каждое утро оставляет у причала ракушку для Хозяйки приливов.
    mutual: false
