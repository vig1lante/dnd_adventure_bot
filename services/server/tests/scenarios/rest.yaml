# Привалы по кнопке хоста (DND-2, блок B9): конец привала и идеи «расскажи о себе».
# Привал начинает хост кнопкой, без хода мастера, поэтому первый ход мастера здесь — «конец привала»:
# он повторяется сколько нужно (шаблон), чтобы хватило на короткий и долгий привалы подряд.
# $pc1…$pc6 — id персонажей по порядку входа, их подставляет сервер при создании провайдера.
turns:
  - repeat: true
    steps:
      - tool: chronicle
        args: {entry: "Отряд передохнул у костра."}
      - text: "Угли тлеют, отряд переводит дух и собирается в путь."
json:
  # Идеи роли campfire_host (purpose campfire.ideas): по идее на героя. Сервер оставляет только идеи
  # адресатов привала (на коротком — двое, дольше всех вне фокуса; на долгом — все живые герои с
  # игроками) и шлёт каждую только игроку её героя.
  campfire.ideas:
    ideas:
      - {character_id: "$pc1", text: "Расскажи, кто научил тебя держать меч и чем ты ему обязан."}
      - {character_id: "$pc2", text: "Вспомни город, из которого ты сбежал, и что там осталось."}
      - {character_id: "$pc3", text: "Расскажи о храме, где ты впервые услышал голос бога."}
