# Сценарий FakeProvider для генератора приключений: короткий полный проход на 1 час, 6 игроков,
# 3 уровень, модули bg3_flavor и campfire (запрос: --hours 1 --players 6 --level 3
# --modules bg3_flavor,campfire). Это приключение первой версии игры, переложенное на шаги v2
# с минимальными правками: фракция переехала из мира в шаг factions, акты и концовки — из концепта
# в шаг plot, связи NPC — в шаг relations, детали локаций стали шагом location_contents; богов нет.
# Ответы выбираются по purpose шага. Список ответов выдаётся по одному на вызов:
# - generator.location_contents — по ответу на каждую локацию в порядке графа (chapel, undercroft);
# - generator.clues — первый ответ нарочно плохой (у открытия две улики), поэтому валидатор
#   находит too_few_clues, генератор повторяет шаг clues и второй ответ проходит проверку.
# Ожидаемый итог: один круг исправления, ни ошибок, ни предупреждений, оценка времени 74 минуты.
json:
  generator.concept:
    id: chapel-whispers
    title: Шёпот под часовней
    pitch: >-
      В часовне на Серой косе третью ночь звонит колокол, хотя верёвку давно срезали.
      Староста нанимает смельчаков выяснить, кто звонит, пока рыбаки не перестали
      выходить в море.
    tone: мрачный детектив с чёрным юмором
    journal_intro: >-
      На Серой косе по ночам сам звонит колокол часовни. Староста просит отряд узнать, кто звонит.
    revelations:
      - id: bell-truth
        statement: >-
          Колокол звонит потому, что звонарь Отто открыл склеп, пытаясь вернуть умершую
          дочь, и разбудил мертвецов.
  generator.world:
    history: >-
      Серая коса давно кормит рыбаков и хоронит их же. Часовню строили на старом
      склепе, о котором стараются не вспоминать.
    rumors:
      - text: Колокол звонит, когда в склепе кто-то просыпается.
        "true": true
      - text: Дочь звонаря утонула прошлой весной.
        "true": true
  generator.pantheon:
    deities: []
  generator.factions:
    factions:
      - id: fishers
        name: Рыбацкая артель
        goal: Вернуть людей в море и не пускать чужих в дела косы.
        methods: Сходки на берегу и круговая порука.
  generator.plot:
    acts:
      - id: act-1
        title: Колокол без верёвки
        summary: >-
          Отряд осматривает часовню, говорит со звонарём Отто и находит
          подтверждение, что колокол звонит не сам.
        key_scenes:
          - Осмотр оборванной верёвки колокола.
          - Разговор с Отто, который прячет глаза.
      - id: act-2
        title: Склеп под алтарём
        summary: >-
          За запертой плитой начинается склеп, где Отто пытался вернуть дочь. Теперь
          там хозяйничает нежить, и с ней придётся сразиться.
        key_scenes:
          - Ключ от плиты и спуск в склеп.
          - Бой с упырями и тенями.
    endings:
      - Отряд упокаивает мертвецов, и колокол замолкает. Отто остаётся хранить часовню.
      - Отряд уводит Отто и закрывает склеп. Колокол звонит ещё одну ночь, но уже без причины.
  generator.locations:
    start_location: chapel
    finale_location: undercroft
    locations:
      - id: chapel
        name: Часовня на Серой косе
        region: Прибрежная скала
        exits:
          - id: to-undercroft
            to: undercroft
            direction: вниз
            description: Каменная плита у алтаря, запертая на старый замок.
            locked_by: item:undercroft-key
      - id: undercroft
        name: Склеп под часовней
        region: Подземелье
        exits:
          - id: to-chapel
            to: chapel
            direction: вверх
            description: Крутая лестница к плите.
  generator.location_contents:
    - read_aloud: >-
        Ветер свистит в разбитых окнах. Под потолком качается колокол, а от верёвки
        остался обрезанный огрызок. Пахнет солью и свечным воском.
      dm_notes: >-
        Колокол звонит по ночам. Ключ от плиты лежит в нише за алтарём. Отто нервничает и
        сначала всё отрицает.
      features:
        - id: bell-rope
          name: Обрезанная верёвка
          description: >-
            Верёвка колокола срезана на высоте плеча, а на полу следы мокрых сапог ведут
            к алтарю.
          check:
            ability: wis
            skill: perception
            dc: 10
        - id: altar-niche
          name: Ниша за алтарём
          description: За расшатанным камнем лежит тяжёлый ключ с ржавой бородкой.
    - read_aloud: >-
        Холодный воздух пахнет сырой землёй. В свете факелов видны ряды ниш, а в глубине
        зала кто-то ходит, шаркая по камню.
      dm_notes: >-
        Нежить поднимается, когда отряд подходит к центральной плите.
      features:
        - id: cracked-slab
          name: Треснувшая плита
          description: >-
            Плита с именем девочки расколота изнутри, а вокруг свежие царапины, как от
            ногтей.
          check:
            ability: int
            skill: investigation
            dc: 15
  generator.npcs:
    npcs:
      - id: otto
        name: Отто
        role: звонарь часовни
        appearance: Сутулый старик с мозолистыми руками и красными от недосыпа глазами.
        manner: Говорит тихо, перебивает сам себя и не смотрит в глаза.
        motive: Вернуть дочь, пока не поздно.
        secret: Это он снял плиту и прочёл над ней запретные слова.
        knows:
          - Колокол звонит, когда в склепе что-то просыпается.
        attitude: 0
        location_id: chapel
      - id: greta
        name: Грета
        role: дочь звонаря
        appearance: Бледная девочка в мокром платье, волосы сплелись с морской травой.
        manner: Отвечает шёпотом и повторяет последние слова собеседника.
        motive: Вернуться домой, хоть и не помнит, где он.
        secret: Не понимает, что умерла.
        attitude: 1
        location_id: undercroft
  generator.relations:
    relations:
      - id: otto-kin-greta
        a: npc:otto
        b: npc:greta
        kind: kin
        note: Отец и дочь, которую он не смог спасти.
  generator.encounters:
    encounters:
      - id: ghoul-pack
        location_id: undercroft
        trigger: Отряд подходит к центральной плите или шумит в зале.
        tactics: >-
          Упыри бросаются на тех, кто ближе к выходу, тени заходят с боков и целятся в слабых.
          Нежить не отступает, пока не разрушена.
        monsters:
          - monster_id: ghoul
            count: 3
          - monster_id: shadow
            count: 3
  generator.items:
    items:
      - id: undercroft-key
        name: Ржавый ключ от плиты
        description: Тяжёлый ключ с ржавой бородкой, подходит к замку на плите у алтаря.
        holder: location:chapel
      - id: wet-locket
        name: Мокрый медальон
        description: Серебряный медальон с портретом девочки, внутри застрял песок.
        holder: npc:greta
  generator.clues:
    # Плохой ответ: у открытия две улики, нужно не меньше трёх.
    - revelations:
        - revelation_id: bell-truth
          clues:
            - id: clue-rope
              description: Верёвка срезана изнутри часовни, а следы мокрых сапог ведут к алтарю.
              where: feature:bell-rope
            - id: clue-slab
              description: Плита в склепе расколота изнутри, а на ней имя дочери звонаря.
              where: feature:cracked-slab
    # Хороший ответ после круга исправления: три улики в двух местах.
    - revelations:
        - revelation_id: bell-truth
          clues:
            - id: clue-rope
              description: Верёвка срезана изнутри часовни, а следы мокрых сапог ведут к алтарю.
              where: feature:bell-rope
            - id: clue-otto
              description: Отто проговаривается, что колокол звонит, когда в склепе кто-то просыпается.
              where: npc:otto
            - id: clue-slab
              description: Плита в склепе расколота изнутри, а на ней имя дочери звонаря.
              where: feature:cracked-slab
