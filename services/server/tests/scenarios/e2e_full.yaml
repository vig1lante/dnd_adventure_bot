# Сквозной сценарий Playwright «6 игроков» (план B8.7): весь вечер мастера по порядку вызовов.
# Рассчитан на демо-приключение demo-crypt и ровно шестерых игроков ($pc1…$pc6 — герои по порядку
# входа в игру). Его читает сервер, который поднимает тест `services/webapp/e2e/six-players.spec.ts`
# (`FAKE_LLM_SCENARIO`); порядок ходов закреплён тестом контракта сценариев
# (`tests/llm/test_scenarios_contract.py`), так что правка порядка без правки теста Playwright
# не пройдёт молча. Цели героев ниже тест Playwright читает прямо из этого файла.
#
# Очередь ходов хранится в провайдере игры и идёт от вызова к вызову (при перезапуске сервера она
# начинается заново, поэтому после перезапуска тест мастера уже не просит). Вызовы мастера по порядку:
#   0. открытие игры (после вплетения героев);
#   1. первый раунд: обычная проверка героя 2, тайная проверка героя 3 (его ход сдан «Тайно»),
#      урон герою 2;
#   2. второй раунд: отряд идёт на кладбище, начинается бой со скелетом;
#   3. бой, первый вызов, и 4. бой, второй вызов, на котором мастер кончает сцену;
#   5. третий раунд: мастер начинает привал;
#   6. конец привала (утро; длинный отдых делает сервер);
#   7. шаблон раунда, на случай лишних вызовов.
#
# Бой. Кубы и порядок инициативы в сквозном тесте настоящие (`SystemRng`), и сценарий не знает,
# кто ходит первым: любой из шестерых героев или скелет. Поэтому он рассчитан на любой порядок.
# После начала боя, если первым ходит скелет, мастера сразу зовёт сервер (вызов 3 разыгрывает ход
# скелета); если героя, вызов 3 разыгрывает его ход после «Готов» игрока. Вызов 4 при любом порядке
# приходится на следующий ход и кончает сцену. Так в бою всегда ровно два вызова мастера, а между
# ними игроки видят, чей герой ходит. Вызов 3 для каждого героя называет «Уклоняется» и вовлекает
# скелета в ближний бой с героем 1 перед ударом: сработает то, что относится к бойцу, который
# действует в этом вызове (чей ход сейчас), а остальные вызовы вернут мастеру отказ «не действует
# в этом вызове» — на ход и игру он не влияет.
turns:
  # 0. Открытие игры.
  - steps:
      - tool: chronicle
        args: {entry: "Отряд собрался в Мшистом Броде."}
      - text: "Вечер в Мшистом Броде. Отряд собрался у трактира «Сонный покойник»: в окнах дрожит свет, а с холма тянет сырой землёй."
  # 1. Первый раунд. Бросок героя 3 тайный: его ход игрок сдаёт с отметкой «Тайно».
  - steps:
      - tool: request_check
        args: {character_id: "$pc2", ability: dex, skill: acrobatics, dc: 10, reason: "перепрыгнуть лужу у крыльца"}
      - tool: request_check
        args: {character_id: "$pc3", ability: dex, skill: stealth, dc: 15, reason: "подобраться к окну трактира"}
      - tool: damage
        args: {character_id: "$pc2", dice: "1d4", damage_type: bludgeoning, reason: "оступился на мокром крыльце"}
      - tool: chronicle
        args: {entry: "Отряд осмотрел крыльцо трактира."}
      - text: "Кто-то из отряда лихо перепрыгивает лужу, но оступается на мокрых досках крыльца. В окне трактира качнулась занавеска."
  # 2. Второй раунд: отряд идёт на кладбище, начинается бой.
  - steps:
      - tool: move_party
        args: {location_id: cemetery, via_exit: to-cemetery}
      - tool: start_combat
        args: {monsters: [{monster_id: skeleton, count: 1, zone: gate}]}
      - tool: chronicle
        args: {entry: "У ворот кладбища поднялся скелет-страж, начался бой."}
      - text: "Отряд поднимается на холм. Земля у ворот вздрагивает, и из тумана выходит скелет с ржавым мечом."
  # 3. Бой, первый вызов мастера (см. выше). Каждый герой «Уклоняется» — сработает у того, чей ход
  #    сейчас; скелет вовлекается в бой и бьёт, если ходит в этом вызове.
  - steps:
      - {tool: combat_action, args: {actor_id: "$pc1", action: dodge}}
      - {tool: combat_action, args: {actor_id: "$pc2", action: dodge}}
      - {tool: combat_action, args: {actor_id: "$pc3", action: dodge}}
      - {tool: combat_action, args: {actor_id: "$pc4", action: dodge}}
      - {tool: combat_action, args: {actor_id: "$pc5", action: dodge}}
      - {tool: combat_action, args: {actor_id: "$pc6", action: dodge}}
      - {tool: move, args: {actor_id: skeleton-1, engage: "$pc1"}}
      - {tool: monster_action, args: {monster_id: skeleton-1, action_id: shortsword, target_ids: ["$pc1"]}}
      - tool: chronicle
        args: {entry: "Бой со скелетом у ворот кладбища продолжается."}
      - text: "Ржавый меч свистит над головами, а герои пригибаются и ищут, куда ударить."
  # 4. Бой, второй вызов: мастер кончает сцену.
  - steps:
      - tool: end_scene
        args: {next: exploration, reason: "Скелет рассыпался."}
      - tool: chronicle
        args: {entry: "Скелет-страж рассыпался, бой окончен."}
      - text: "Скелет разваливается на груду костей, и над кладбищем снова становится тихо."
  # 5. Третий раунд: отряд решает отдохнуть, мастер начинает привал.
  - steps:
      - tool: start_camp
        args: {reason: "отряд разжигает костёр у сторожки"}
      - tool: chronicle
        args: {entry: "Отряд разбил лагерь у сторожки."}
      - text: "Над сторожкой поднимается дымок: отряд устраивается у огня и слушает, как в тумане стучит ветка."
  # 6. Конец привала. Длинный отдых и утро уже провёл сервер, мастер только рассказывает.
  - steps:
      - tool: chronicle
        args: {entry: "Отряд переночевал у костра."}
      - text: "Утро. Туман отступил, костёр прогорел, а отряд проснулся отдохнувшим и полным сил."
  # 7. Шаблон раунда: повторяется бесконечно, если мастера зовут чаще, чем рассчитано.
  - repeat: true
    steps:
      - tool: chronicle
        args: {entry: "Отряд идёт дальше."}
      - text: "Отряд идёт дальше, и впереди снова что-то шевелится."
json:
  # Вплетение: у каждого из шестерых героев своя цель (тест Playwright ищет её у героя на экране
  # и не должен найти у остальных, поэтому ни одна цель не входит в другую) и связь с миром.
  weaving:
    hooks:
      - character_id: "$pc1"
        npc_links:
          - {npc_id: marta, relation: "двоюродная сестра", note: "нянчила вас в детстве"}
        location_links:
          - {location_id: village, note: "здесь вы выросли"}
        party_links:
          - {character_id: "$pc2", relation: "старый друг"}
        personal_goal: "найти пропавшего смотрителя Ульриха"
      - character_id: "$pc2"
        npc_links:
          - {npc_id: fabian, relation: "должник", note: "задолжал вам и прячется"}
        personal_goal: "вернуть долг до рассвета"
      - character_id: "$pc3"
        location_links:
          - {location_id: cemetery, note: "вы ухаживали здесь за могилами"}
        personal_goal: "узнать, кто шепчет на кладбище"
        secret: "вы слышите шёпот мёртвых и никому об этом не говорили"
      - character_id: "$pc4"
        npc_links:
          - {npc_id: marta, relation: "постоялец", note: "каждую осень снимаете у неё комнату"}
        personal_goal: "отыскать сестру, ушедшую в храм"
      - character_id: "$pc5"
        location_links:
          - {location_id: village, note: "здесь вас считают вором"}
        party_links:
          - {character_id: "$pc6", relation: "земляки"}
        personal_goal: "доказать гильдии, что вы не вор"
      - character_id: "$pc6"
        location_links:
          - {location_id: cemetery, note: "здесь вы однажды заблудились"}
        personal_goal: "нарисовать карту склепа"
  # Быстрое создание героя: имя игрок задаёт сам, поэтому ответ меняет только описание.
  character.flavor:
    name: Эльвира Вайс
    appearance: Высокая, жилистая, со шрамом через бровь и тёмной косой до пояса.
    traits: Говорит коротко, подмечает мелочи и никогда не садится спиной к двери.
    ideals: Долг важнее выгоды, но слово, данное врагу, тоже слово.
    bonds: Младший брат остался в приграничной деревне, и она шлёт ему каждое жалованье.
    flaws: Не умеет просить помощи и принимает чужую осторожность за трусость.
    backstory: >-
      Выросла на заставе у перевала и с детства видела, как разбойники обирают обозы.
      Ушла в наёмники, чтобы однажды вернуться и навести там порядок.
  character.backstory:
    backstory: >-
      Вырос в портовом городе, где каждый второй чей-то должник. Научился читать людей
      раньше, чем читать книги, и теперь ищет тех, кто разорил его семью.
  # Сжатие летописи: до него вечер не доходит (меньше двадцати записей), ответ нужен на всякий случай.
  chronicle:
    summary: "Отряд собрался в Мшистом Броде, отбился от скелета на кладбище и переночевал у костра."
  # Шаги генератора для конструктора (блок 4 DND-2): сквозной тест `services/webapp/e2e/authoring.spec.ts`
  # генерирует на настоящем сервере замысел, мир, богов, фракции и сюжет. Каждое задание конструктора
  # собирает свой провайдер, поэтому ответ шага один и повторная генерация отдаёт его снова: тест так
  # и видит, что закреплённый бог остался, а незакреплённая ручная правка заменена ответом шага.
  # Ссылок в никуда нет (у фракций нет лидеров и баз, злодей — бог из пантеона), поэтому проверка
  # черновика не находит ошибок, и все пять шагов становятся «готово».
  generator.concept:
    id: crow-lighthouse
    title: Маяк на Вороньем мысу
    pitch: >-
      Маяк на Вороньем мысу погас неделю назад, и корабли бьются о скалы. Начальница гавани
      просит зажечь огонь и узнать, что стало со смотрителем.
    tone: морская готика с мрачным юмором
    journal_intro: Маяк погас, корабли бьются о скалы. Отряд должен зажечь огонь и найти смотрителя.
    revelations:
      - id: ash-truth
        statement: Маяк погасил жрец Пепельного — он топит корабли, чтобы кормить своего бога.
  generator.world:
    history: Вороний мыс — последний клочок суши перед открытым морем. Маяк стоит здесь триста лет.
    regions:
      - id: crow-cape
        name: Вороний мыс
        description: Скалистый мыс с рыбацкой гаванью внизу и маяком на вершине.
        public: Скалистый мыс с гаванью и маяком.
        known_at_start: true
    rumors:
      - text: Смотритель маяка сбежал с контрабандистами.
        "true": false
        known_at_start: true
      - text: По ночам на маяке горит не огонь, а пепел.
        "true": true
  generator.pantheon:
    deities:
      - id: selmara
        name: Сельмара
        title: Хозяйка приливов
        domains: [море, путь домой]
        symbol: Раковина с жемчужиной-огоньком.
        dogma: Держи огонь для тех, кто в море.
        appearance: Высокая женщина в мокром плаще, с фонарём из перламутра.
        attitude_to_mortals: Милостива к морякам и смотрителям.
        public: Богиня моря и маяков; ей молятся моряки.
        known_at_start: true
      - id: ashen-one
        name: Пепельный
        title: Тот, кто ест огни
        domains: [пепел, голод]
        symbol: Чёрная свеча без фитиля.
        dogma: Каждый погасший огонь — пища.
        appearance: Фигура из пепла, у которой вместо лица дым.
        attitude_to_mortals: Считает людей дровами.
        secret: Когда-то костры под маяком жгли ему.
  generator.factions:
    factions:
      - id: harbor-guard
        name: Стража гавани
        goal: Беречь гавань и корабли.
        methods: Дозоры на пирсах и сигнальные костры.
        attitude_to_party: 1
        public: Стража, что следит за порядком в гавани.
        known_at_start: true
      - id: ash-circle
        name: Пепельный круг
        goal: Погасить все огни побережья во славу Пепельного.
        methods: Обряды, крушения кораблей и запугивание.
        secret: Круг — горстка фанатиков, подобранных после крушений.
        attitude_to_party: -3
  generator.plot:
    acts:
      - id: act-1
        title: Тёмный маяк
        summary: Отряд приходит в гавань и узнаёт, что смотритель пропал, а на тропе к маяку пепел.
        key_scenes:
          - Разговор с начальницей гавани.
          - Подъём по тропе над обрывом.
      - id: act-2
        title: Пепельный обряд
        summary: В фонарной идёт обряд Пепельному; отряд должен прервать его и зажечь огонь.
        key_scenes:
          - Бой у пепельного алтаря.
    endings:
      - Отряд прерывает обряд и снова зажигает маяк.
      - Алтарь разбит, но Пепельный круг затаился.
    villain: deity:ashen-one
