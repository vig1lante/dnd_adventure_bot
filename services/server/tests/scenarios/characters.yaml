# Сценарий FakeProvider для создания персонажей: описательная часть быстрого и случайного режимов и
# «помоги написать» для предыстории. Ответ выбирается по purpose запроса.
# Чисел в ответах нет: числа персонажа считает движок, модель пишет только текст.
json:
  character.flavor:
    name: Эльвира Вайс
    appearance: Высокая, жилистая, со шрамом через бровь и тёмной косой до пояса.
    traits: Говорит коротко, подмечает мелочи и никогда не садится спиной к двери.
    ideals: Долг важнее выгоды, но слово, данное врагу, тоже слово.
    bonds: Младший брат остался в приграничной деревне, и она шлёт ему каждое жалованье.
    flaws: Не умеет просить помощи и принимает чужую осторожность за трусость.
    backstory: >-
      Эльвира выросла на заставе у перевала и с детства видела, как разбойники
      обирают обозы. Ушла в наёмники, чтобы однажды вернуться и навести там порядок.
  character.backstory:
    backstory: >-
      Он вырос в портовом городе, где каждый второй чей-то должник. Научился
      читать людей раньше, чем читать книги, и теперь ищет тех, кто разорил его семью.
