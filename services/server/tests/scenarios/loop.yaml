# Сценарий зацикливания (план B7.3): модель снова и снова читает одно и то же место. Исполнитель
# отказывает в повторах после третьего, но вызовы идут в счёт итераций хода: с пределом 5 (так
# его ставят тесты) ход превышает лимит и не удаётся, с боевым пределом 20 сценарий проходит.
# Вызовов меньше двадцати нарочно: тест контракта сценариев прогоняет каждый ход с боевым пределом.
# Сценарий только для автотестов: предел итераций в коде равен 20 и настройками не меняется, а
# ответа вплетения здесь нет, поэтому игра с ним после «Начать» остановится в dm_failed.
