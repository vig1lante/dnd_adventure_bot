      - {tool: get_location, args: {}}
      - {tool: get_location, args: {}}
      - {tool: get_location, args: {}}
      - {tool: get_location, args: {}}
      - {tool: get_location, args: {}}
      - {tool: get_location, args: {}}
      - {tool: get_location, args: {}}
      - {tool: get_location, args: {}}
      - {tool: get_location, args: {}}
