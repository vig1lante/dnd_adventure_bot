# Базовый сценарий FakeProvider: ход мастера (бросок, летопись, рассказ) и один JSON-ответ.
# $pc1…$pc6 — id персонажей по порядку входа, их подставляет сервер при создании провайдера.
# Второй ход — шаблон: он повторяется бесконечно, чтобы в ручной игре хватало ходов на любое число
# раундов (первый ход мастера игры — открытие — тоже берёт ходы из этой очереди).
turns:
  - steps:
      - tool: request_check
        args: {character_id: "$pc1", ability: dex, skill: stealth, dc: 15, reason: "крадётся"}
      - tool: chronicle
        args: {entry: "Отряд прокрался к склепу."}
      - text: "Тени скрывают вас…"
  - repeat: true
    steps:
      - tool: chronicle
        args: {entry: "Отряд идёт дальше."}
      - text: "Отряд идёт дальше, и впереди снова что-то шевелится."
json:
  # Вплетение: зацепка героя $pc1 (первого игрока), связи с NPC и местом из demo-crypt. Остальные
  # герои (если игроков больше одного) без зацепок: сервер один раз повторит запрос и запишет
  # предупреждение. $pcN в JSON-ответах подставляет FakeProvider, как и в аргументах инструментов.
  weaving:
    hooks:
      - character_id: "$pc1"
        npc_links:
          - {npc_id: marta, relation: "старая знакомая", note: "кормила вас в долг"}
        location_links:
          - {location_id: village, note: "здесь вы выросли"}
        personal_goal: "найти пропавшего смотрителя"
  # Сжатие летописи: ручной прогон дольше 20 ходов показывает сводку без предупреждений в журнале.
  chronicle: {summary: "Отряд прокрался к склепу и идёт дальше: впереди снова что-то шевелится."}
