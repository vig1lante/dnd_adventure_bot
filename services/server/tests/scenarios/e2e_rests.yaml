# Сквозной сценарий Playwright «Привалы» (DND-2, блок B9): короткий и долгий привал по кнопке хоста.
# Рассчитан на демо-приключение demo-crypt и ровно троих игроков ($pc1…$pc3 — герои по порядку входа
# в игру). Его читает сервер, который поднимает тест `services/webapp/e2e/rests.spec.ts`
# (`FAKE_LLM_SCENARIO` через параметр `scenario` фикстуры `e2e/server.ts`); тексты идей ниже тест
# читает прямо из этого файла.
#
# Привал по кнопке начинается без хода мастера, поэтому после открытия идут только рассказы концов
# привалов (образец — `rest.yaml`). Вызовы мастера по порядку:
#   0. открытие игры (после вплетения героев): черепица задевает героя 1. Ему есть что лечить костью
#      хитов на коротком привале, и он в фокусе рассказа: идеи короткого привала достаются двоим,
#      кто дольше вне фокуса, — героям 2 и 3;
#   1. конец короткого привала (хост жмёт «Закончить привал»): прошёл час, время суток то же;
#   2. конец долгого привала (по отсчёту): утро следующего дня, длинный отдых делает сервер;
#   3. шаблон раунда, на случай лишних вызовов.
turns:
  # 0. Открытие игры.
  - steps:
      - tool: damage
        args: {character_id: "$pc1", dice: "1d4", damage_type: bludgeoning, reason: "черепица с крыши трактира"}
      - tool: chronicle
        args: {entry: "Отряд собрался у трактира, черепица задела одного из героев."}
      - text: "Сумерки над Мшистым Бродом. С крыши трактира «Сонный покойник» срывается черепица и бьёт одного из героев по плечу: отряду явно пора перевести дух."
  # 1. Конец короткого привала: особенности «до короткого отдыха» вернул сервер, время не сдвинулось.
  - steps:
      - tool: chronicle
        args: {entry: "Отряд передохнул час у крыльца трактира."}
      - text: "Прошёл час. Повязки затянуты, дыхание выровнялось, а над трактиром всё те же сумерки."
  # 2. Конец долгого привала: длинный отдых и утро следующего дня уже провёл сервер.
  - steps:
      - tool: chronicle
        args: {entry: "Отряд переночевал у костра за трактиром."}
      - text: "Утро нового дня. Туман сполз с холма, костёр за трактиром прогорел, и отряд поднимается отдохнувшим."
  # 3. Шаблон раунда: повторяется бесконечно, если мастера зовут чаще, чем рассчитано.
  - repeat: true
    steps:
      - tool: chronicle
        args: {entry: "Отряд идёт дальше."}
      - text: "Отряд идёт дальше, и впереди снова что-то шевелится."
json:
  # Вплетение: у каждого из троих героев своя цель и связь с миром.
  weaving:
    hooks:
      - character_id: "$pc1"
        npc_links:
          - {npc_id: marta, relation: "двоюродная сестра", note: "нянчила вас в детстве"}
        location_links:
          - {location_id: village, note: "здесь вы выросли"}
        personal_goal: "найти пропавшего смотрителя Ульриха"
      - character_id: "$pc2"
        npc_links:
          - {npc_id: fabian, relation: "должник", note: "задолжал вам и прячется"}
        personal_goal: "вернуть долг до рассвета"
      - character_id: "$pc3"
        location_links:
          - {location_id: cemetery, note: "вы ухаживали здесь за могилами"}
        personal_goal: "узнать, кто шепчет на кладбище"
  # Быстрое создание героя: имя игрок задаёт сам, поэтому ответ меняет только описание.
  character.flavor:
    name: Эльвира Вайс
    appearance: Высокая, жилистая, со шрамом через бровь и тёмной косой до пояса.
    traits: Говорит коротко, подмечает мелочи и никогда не садится спиной к двери.
    ideals: Долг важнее выгоды, но слово, данное врагу, тоже слово.
    bonds: Младший брат остался в приграничной деревне, и она шлёт ему каждое жалованье.
    flaws: Не умеет просить помощи и принимает чужую осторожность за трусость.
    backstory: >-
      Выросла на заставе у перевала и с детства видела, как разбойники обирают обозы.
      Ушла в наёмники, чтобы однажды вернуться и навести там порядок.
  character.backstory:
    backstory: >-
      Вырос в портовом городе, где каждый второй чей-то должник. Научился читать людей
      раньше, чем читать книги, и теперь ищет тех, кто разорил его семью.
  # Идеи роли campfire_host (purpose campfire.ideas): ответ на каждый привал по порядку. В каждом —
  # идея каждому герою; сервер оставляет только идеи адресатов привала и шлёт идею только игроку её
  # героя. На коротком привале адресаты — герои 2 и 3 (герой 1 в фокусе после открытия), поэтому
  # первую идею героя 1 сервер не отдаёт никому; на долгом идею получает каждый. Тексты тест ищет
  # целиком: ни один не входит в другой, кавычек внутри нет.
  campfire.ideas:
    # Короткий привал.
    - ideas:
        - {character_id: "$pc1", text: "Расскажи, кто подарил тебе первый щит и что с ним стало."}
        - {character_id: "$pc2", text: "Вспомни город, из которого ты сбежал, и что там осталось."}
        - {character_id: "$pc3", text: "Расскажи о лесе, где ты впервые потеряла след брата."}
    # Долгий привал.
    - ideas:
        - {character_id: "$pc1", text: "Расскажи у огня, какой приказ ты однажды отказалась выполнить."}
        - {character_id: "$pc2", text: "Вспомни первую монету, которую ты украл, и кому её вернул."}
        - {character_id: "$pc3", text: "Расскажи, какую песню пела твоя мать у ночного костра."}
