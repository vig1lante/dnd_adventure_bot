# Сценарий боя на кладбище demo-crypt (план B7.5): раунд, в котором мастер начинает бой со скелетом,
# боевые ходы героев по кругу и конец сцены. $pc1…$pc3 — Алиса, Борис и Вера (id по порядку входа).
# Рассчитан на очередь «Алиса, скелет, Борис, Вера»: в тестах кубы инициативы заданы (20, 1, 1, 5 для
# Алисы, Бориса, Веры и скелета). При другой очереди часть вызовов вернёт ошибку «не действует в
# этом вызове», и мастер просто расскажет бой своими словами: ход сервер передаёт сам.
# В ручном прогоне первым ходом идёт открытие игры, и бой начинается сразу; вплетение (раздел json
# ниже) названо для ровно трёх героев: с меньшим числом игроков это ошибка сценария (`$pc2` при
# одном игроке, `$pc3` при двух). Отряд в игре стартует в деревне, поэтому первый ход сперва ведёт
# его на кладбище (`move_party`). В тестах отряд уже на кладбище: вызов возвращает ошибку «нет
# выхода», и на ход она не влияет.
# После start_combat никто не вовлечён в ближний бой, а рукопашная атака бьёт только вовлечённого
# противника, поэтому скелет перед ударом вступает в бой с Алисой (`move` с `engage`). Тогда его удар
# проходит и в ручном прогоне, когда ход скелета разбирается отдельным вызовом мастера: в ленте
# появляется карточка атаки с КД героя.
# Очередь ходов хранится в провайдере игры и идёт дальше от хода к ходу.
turns:
  # Раунд обсуждения (в ручном прогоне — открытие игры): мастер начинает бой на кладбище.
  - steps:
      - tool: move_party
        args: {location_id: cemetery}
      - tool: start_combat
        args: {monsters: [{monster_id: skeleton, count: 1, zone: gate}]}
      - tool: chronicle
        args: {entry: "У ворот кладбища поднялся скелет-страж, начался бой."}
      - text: "Земля у ворот вздрагивает, и из тумана выходит скелет с ржавым мечом."
  # Боевой ход Алисы и идущий следом ход скелета.
  - steps:
      - tool: combat_action
        args: {actor_id: "$pc1", action: dodge}
      - tool: move
        args: {actor_id: skeleton-1, engage: "$pc1"}
      - tool: monster_action
        args: {monster_id: skeleton-1, action_id: shortsword, target_ids: ["$pc1"]}
      - tool: chronicle
        args: {entry: "Алиса уклонилась от удара скелета."}
      - text: "Алиса пригибается, и ржавый меч скелета свистит над её головой."
  # Боевой ход Бориса.
  - steps:
      - tool: combat_action
        args: {actor_id: "$pc2", action: dodge}
      - tool: chronicle
        args: {entry: "Борис держится в стороне от скелета."}
      - text: "Борис отступает в тень надгробия и ждёт удобного мгновения."
  # Боевой ход Веры.
  - steps:
      - tool: combat_action
        args: {actor_id: "$pc3", action: dodge}
      - tool: chronicle
        args: {entry: "Вера прикрылась щитом."}
      - text: "Вера поднимает щит, и тот гулко отзывается на удар костяной руки."
  # Второй круг: Алиса, и мастер объявляет конец сцены.
  - steps:
      - tool: end_scene
        args: {next: exploration, reason: "Скелет рассыпался."}
      - tool: chronicle
        args: {entry: "Скелет-страж рассыпался, бой окончен."}
      - text: "Скелет разваливается на груду костей, и над кладбищем снова становится тихо."
json:
  # Вплетение для ручного прогона: по одной-две связи на героя, NPC и места из demo-crypt.
  weaving:
    hooks:
      - character_id: "$pc1"
        npc_links:
          - {npc_id: marta, relation: "двоюродная сестра", note: "нянчила вас в детстве"}
        party_links:
          - {character_id: "$pc2", relation: "старый друг"}
        personal_goal: "найти пропавшего смотрителя и вернуть его сестре"
      - character_id: "$pc2"
        npc_links:
          - {npc_id: fabian, relation: "должник", note: "задолжал вам и прячется"}
        personal_goal: "вернуть долг до рассвета"
      - character_id: "$pc3"
        location_links:
          - {location_id: cemetery, note: "вы ухаживали здесь за могилами"}
        party_links:
          - {character_id: "$pc1", relation: "земляки"}
        secret: "вы слышите шёпот мёртвых и никому об этом не говорили"
