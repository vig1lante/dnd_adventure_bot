# Сценарий неудачного хода (план B7.3): ручная проверка и тесты «Мастер не справился → Повторить».
# Первые два хода без итогового текста: ход мастера делает автоповтор, оба раза пусто, и игра
# уходит в dm_failed. Третий ход нормальный: на нём срабатывает «Повторить» хоста.
# В ручном прогоне первым ходом идёт открытие игры: вплетение проходит (раздел json ниже), открытие
# не удаётся, хост нажимает «Повторить», и открытие берёт третий ход. В автотестах хода состояние
# готовят сами, и первым идёт ход игроков.
# Очередь ходов хранится в провайдере игры и идёт дальше от хода к ходу.
turns:
  - steps:
      - tool: chronicle
        args: {entry: "Первая попытка: рассказа нет."}
  - steps:
      - tool: chronicle
        args: {entry: "Автоповтор: рассказа нет и теперь."}
  - steps:
      - tool: chronicle
        args: {entry: "Повтор хоста: ход разобран."}
      - text: "Мастер собрался с мыслями, и рассказ наконец готов."
json:
  # Вплетение для ручного прогона: зацепка только у первого героя, поэтому сценарий подходит игре
  # из любого числа игроков (у остальных зацепок нет, сервер один раз повторит запрос и запишет
  # предупреждение). $pc1 подставляет FakeProvider; NPC и место взяты из demo-crypt.
  weaving:
    hooks:
      - character_id: "$pc1"
        npc_links:
          - {npc_id: marta, relation: "старая знакомая", note: "кормила вас в долг"}
        location_links:
          - {location_id: village, note: "здесь вы выросли"}
        personal_goal: "найти пропавшего смотрителя"
