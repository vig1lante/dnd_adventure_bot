# Alembic сервера. Запуск из корня репозитория:
#   uv run alembic -c services/server/alembic.ini upgrade head
# Адрес базы здесь не задаётся: env.py берёт DATABASE_URL из настроек сервера (окружение и .env),
# поэтому миграции и приложение всегда смотрят в один файл.
# Новая ревизия (на временной базе, поднятой до head; номера сквозные):
#   DATABASE_URL=sqlite+aiosqlite:///<временный файл> \
#     uv run alembic -c services/server/alembic.ini revision --autogenerate --rev-id 0002 -m "..."

[alembic]
# %(here)s — папка этого файла, поэтому путь не зависит от текущего каталога.
script_location = %(here)s/migrations
