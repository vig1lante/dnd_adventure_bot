# Черты происхождения из SRD 5.2.1 (CC BY 4.0). Краткий пересказ своими словами, не копия текста.
# Механические черты (mechanical: true) считает движок; остальные — только текст для мастера.
- id: alert
  name: Бдительный
  summary: "К броску инициативы добавляется бонус мастерства. После броска инициативы можно поменяться ею с согласным союзником из того же боя."
  mechanical: true
# Не механическая: выбора заговоров черты и свободного сотворения в движке нет, мастер берёт текст.
- id: magic_initiate
  name: Посвящённый в магию
  summary: "Два заговора и одно заклинание 1-го уровня из списка жреца, друида или волшебника. Заклинание 1-го уровня можно раз за длинный отдых сотворить без ячейки. Список задаёт предыстория: у Прислужника жреца, у Мудреца волшебника."
  mechanical: false
- id: savage_attacker
  name: Свирепый атакующий
  summary: "Раз за ход при попадании оружием можно бросить кости урона оружия дважды и взять больший результат."
  mechanical: true
