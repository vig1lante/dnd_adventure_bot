# Монстры SRD 5.2.1 (CC BY 4.0) с ПО не выше 3. Краткий пересказ своими словами, не копия текста.
#
# Соглашения:
# - hp — среднее значение из статблока, hp_dice — его запись костей; speed — скорость ходьбы
#   в футах; saves — итоговые бонусы спасбросков только там, где они отличаются от
#   модификатора характеристики; skills — итоговые бонусы навыков.
# - resistances и vulnerabilities — типы урона; immunities — типы урона и состояния вместе
#   (иммунитет к истощению не записан: в срезе его нет).
# - actions: attack — атака с бонусом attack_bonus, damage и damage_type. Если у удара два вида
#   урона, второй записан отдельно: secondary_damage (кости) и secondary_damage_type, потому что
#   сопротивления и уязвимости цели применяются к каждому типу отдельно. reach: true —
#   досягаемость 10 футов (бьёт и невовлечённого врага в своей зоне). Дополнительный урон «при
#   преимуществе» (гоблины) не моделируется, он описан в summary.
#   У attack поле condition без save означает состояние при попадании; condition вместе с save и
#   dc — состояние при провале спасброска после попадания. save — спасбросок цели без броска
#   атаки; multiattack перечисляет действия, которые монстр делает подряд; other — только
#   событие для рассказа (бонусные действия, реакции, колдовство).
# - targets — сколько разных существ захватывает действие со спасброском (save). По умолчанию
#   одно, как у паутины; для области (дыхание, волна) число записывается явно. Движок отказывает,
#   если мастер назвал больше целей. У attack цель одна, а multiattack бьёт не больше целей,
#   чем в нём атак.
# - range: melee — вплотную; near — метание и дальность до 60 футов; far — луки и арбалеты.
#   Оружие «ближнего или дальнего боя» записано двумя действиями (суффикс _thrown).
# - traits — особенности без механики в полях, текстом для мастера.
