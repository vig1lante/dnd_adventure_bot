# Состояния SRD 5.2.1 (CC BY 4.0), 14 штук (истощение в срез не входит). Краткий пересказ своими
# словами, не копия текста. Эффекты (преимущество, помеха, автопровал спасбросков) движок берёт
# из таблицы состояний в коде, а summary нужен мастеру и игрокам.
- id: blinded
  name: Ослеплён
  summary: "Не видит и автоматически проваливает проверки, требующие зрения. Атаки по нему идут с преимуществом, его атаки — с помехой."
- id: charmed
  name: Очарован
  summary: "Не может атаковать очаровавшего и нацеливать на него вредные способности. У очаровавшего преимущество на социальные проверки против него."
- id: deafened
  name: Оглушён
  summary: "Оглох: не слышит и автоматически проваливает проверки, требующие слуха."
- id: frightened
  name: Напуган
  summary: "Помеха на проверки и атаки, пока источник страха виден. Не может добровольно приближаться к источнику страха."
- id: grappled
  name: Схвачен
  summary: "Скорость 0. Помеха на атаки по всем целям, кроме схватившего. Схвативший может тащить его за собой."
- id: incapacitated
  name: Недееспособен
  summary: "Не может совершать действия, бонусные действия и реакции, говорить; концентрация прерывается. Помеха на инициативу, если недееспособен при броске."
- id: invisible
  name: Невидим
  summary: "Скрыт от эффектов, требующих видеть цель. Атаки по нему идут с помехой, его атаки — с преимуществом. Преимущество на инициативу."
- id: paralyzed
  name: Парализован
  summary: "Недееспособен, скорость 0, автоматически проваливает спасброски Силы и Ловкости. Атаки по нему идут с преимуществом, а попадание вплотную — критическое."
- id: petrified
  name: Окаменел
  summary: "Превращён в камень: недееспособен, скорость 0, проваливает спасброски Силы и Ловкости, сопротивляется всему урону и неуязвим к отравлению. Атаки по нему с преимуществом."
- id: poisoned
  name: Отравлен
  summary: "Помеха на броски атаки и проверки характеристик."
- id: prone
  name: Сбит с ног
  summary: "Может только ползти или потратить половину скорости, чтобы встать. Помеха на его атаки. Атаки по нему с преимуществом вплотную и с помехой издали."
- id: restrained
  name: Опутан
  summary: "Скорость 0. Атаки по нему идут с преимуществом, его атаки — с помехой. Помеха на спасброски Ловкости."
- id: stunned
  name: Ошеломлён
  summary: "Недееспособен, автоматически проваливает спасброски Силы и Ловкости. Атаки по нему идут с преимуществом."
- id: unconscious
  name: Без сознания
  summary: "Недееспособен и лежит ничком, роняет всё из рук, скорость 0, проваливает спасброски Силы и Ловкости. Атаки по нему с преимуществом, а попадание вплотную — критическое."
