# Заклинания SRD 5.2.1 (CC BY 4.0) для жреца, волшебника и следопыта: заговоры и уровни 1–2.
# Краткий пересказ своими словами, не копия текста.
#
# Соглашения:
# - classes — только классы среза (cleric, wizard, ranger) из списков заклинаний SRD.
# - school — школа магии по SRD 5.2.1 (лечащие заклинания там — abjuration, «Чудо-ягоды» —
#   conjuration); русские подписи школ даёт сервер.
# - range: self, touch; near — до 18 м (рядом); far — дальше 18 м (далеко).
# - duration_rounds — длительность в раундах по 6 секунд (минута — 10, час — 600); null —
#   мгновенное заклинание. У заклинаний с концентрацией длительность обязательна.
# - effect.kind: attack — бросок атаки заклинанием; save — спасбросок цели; auto — урон без броска;
#   heal — лечение; buff — ActiveBuff с id из effect.buff; condition — ActiveCondition;
#   utility — только событие для рассказа (или эффект, который движок не считает полями).
#   У kind: attack/save поле buff или condition — дополнительный эффект при попадании или
#   провале спасброска. heal_modifier: true — к лечению (cure_wounds, healing_word)
#   прибавляется модификатор заклинательной характеристики, как в SRD; движок берёт его по полю.
# - out_of_combat_only: true — заклинание сотворяется минутами (prayer_of_healing), в бою его
#   нельзя сотворить; время сотворения полями не выражено, casting_time у него остаётся action.
# - targets — наибольшее число целей; у заклинаний по площади (конус, куб, сфера) это 6, предел
#   по числу участников. repeats — число бросков (дротиков, лучей).
# - upcast — добавка кубов или чисел за каждый уровень ячейки выше уровня заклинания; если
#   за ячейку растёт что-то иное (число целей, дротиков, время), оно описано в summary.
#   Исключение — заклинания с repeats (magic_missile, scorching_ray): их upcast равен урону
#   одного дополнительного дротика или луча (repeats растёт на 1 за уровень ячейки), а не добавке
#   к каждому из уже существующих; урон прежних дротиков и лучей не меняется.

