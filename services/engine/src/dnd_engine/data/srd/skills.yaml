# Восемнадцать навыков SRD 5.2.1 (CC BY 4.0). Краткий пересказ своими словами, не копия текста.
# Название и характеристика навыка — в abilities.py (SKILL_NAMES_RU, SKILL_ABILITY); здесь только
# текст карточки навыка при создании героя: что проверяет навык и примеры применения.
- id: athletics
  summary: "Сила тела в движении: лазанье, прыжки, плавание, борьба. Например: взобраться по мокрой стене, перепрыгнуть расщелину, удержаться на плаву в бурной реке."
- id: acrobatics
  summary: "Равновесие и гибкость в трудном положении. Например: пробежать по узкой балке, устоять на палубе в шторм, выскользнуть из захвата."
- id: sleight_of_hand
  summary: "Ловкие и незаметные движения рук. Например: вытащить кошелёк из чужого кармана, спрятать в рукаве мелкую вещь, незаметно подменить ключ."
- id: stealth
  summary: "Умение двигаться тихо и оставаться незамеченным. Например: прокрасться мимо стражи, спрятаться в тени, подобраться к врагу со спины."
- id: arcana
  summary: "Знания о магии, заклинаниях, волшебных предметах и других планах бытия. Например: узнать заклинание по жестам, прочесть магический знак, понять, куда ведёт портал."
- id: history
  summary: "Знания о прошлом: событиях, людях, державах и народах. Например: вспомнить, кто построил крепость, узнать герб древнего рода, понять, о какой войне говорит надпись."
- id: investigation
  summary: "Поиск улик и выводы из них. Например: найти тайник в комнате, понять, как устроена ловушка, отыскать нужное в старых записях."
- id: nature
  summary: "Знания о местности, растениях, животных и погоде. Например: отличить съедобный гриб от ядовитого, предсказать бурю, вспомнить повадки редкого зверя."
- id: religion
  summary: "Знания о богах, обрядах, священных символах и культах. Например: узнать символ божества, понять смысл ритуала, вспомнить, чего боится нежить."
- id: animal_handling
  summary: "Умение ладить с животными. Например: успокоить испуганную лошадь, утихомирить сторожевого пса, удержаться верхом на норовистом скакуне."
- id: insight
  summary: "Понимание чужих чувств и намерений. Например: почувствовать ложь в словах торговца, заметить, что собеседник напуган, угадать, кто здесь на самом деле главный."
- id: medicine
  summary: "Знания о ранах и болезнях. Например: стабилизировать умирающего союзника, узнать болезнь по признакам, понять, отчего погиб человек."
- id: perception
  summary: "Внимание ко всему вокруг: зрение, слух, обоняние. Например: услышать шаги за дверью, заметить засаду в кустах, увидеть блеск монеты в траве."
- id: survival
  summary: "Жизнь в дикой природе. Например: идти по следу, найти дорогу без карты, добыть воду и еду в лесу, обойти трясину."
- id: deception
  summary: "Умение убедительно лгать и притворяться. Например: выдать себя за стражника, отвлечь врага выдуманной историей, не выдать себя, пряча краденое в кармане."
- id: intimidation
  summary: "Давление угрозой или показом силы. Например: заставить бандита отступить, выбить признание у пленника, разогнать зевак грозным окриком."
- id: performance
  summary: "Выступление перед публикой: музыка, танец, игра, рассказ. Например: развлечь таверну песней, отвлечь толпу представлением, сыграть на празднике за ночлег."
- id: persuasion
  summary: "Честное и вежливое убеждение. Например: уговорить старосту помочь, договориться о цене, примирить спорщиков."
