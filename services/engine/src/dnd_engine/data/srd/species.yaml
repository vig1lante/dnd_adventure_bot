# Девять видов SRD 5.2.1 (CC BY 4.0). Краткий пересказ своими словами, не копия текста.
# Механические черты (mechanical: true) считает движок; остальные — текст для мастера.
# description — 2–3 предложения о расе для карточки при создании героя.
# Черты, которые действуют только с 5-го уровня (Драконий полёт, Большая форма), в срез не входят.
# Выбор наследия (предок дракона, линия эльфа и т. п.) в создании персонажа не моделируется.
# Размер у человека и тифлинга в SRD выбирается; в данных указан medium.
- id: dragonborn
  name: Драконорождённый
  name_en: Dragonborn
  description: "Драконорождённые похожи на драконов, вставших на две ноги: чешуя, когти и гордая осанка, но ни крыльев, ни хвоста. От дракона-предка им достались дыхание его стихии и стойкость к ней. Цвет чешуи часто подсказывает, какой дракон стоит у истоков рода."
  size: medium
  speed: 30
  traits:
    - id: draconic_ancestry
      name: Драконье происхождение
      summary: "Выбирается дракон-предок. От него зависит тип урона дыхания и сопротивления: кислота, молния, огонь, яд или холод."
      mechanical: false
    - id: breath_weapon
      name: Дыхание
      summary: "Вместо одной атаки: конус 4,5 м или линия 9 м. Спасбросок Ловкости, Сл 8 + Тел + БМ; 1к10 урона типа предка, половина при успехе. Столько раз, каков бонус мастерства, до длинного отдыха."
      mechanical: true
    - id: damage_resistance
      name: Сопротивление урону
      summary: "Сопротивление типу урона, определённому драконом-предком."
      mechanical: true
    - id: darkvision
      name: Тёмное зрение
      summary: "Видит в темноте на 18 м."
      mechanical: false
- id: dwarf
  name: Дварф
  name_en: Dwarf
  description: "Дварфы — невысокий, коренастый и крепкий народ горных крепостей и подземных городов. Яд вредит им слабее, чем другим, а камень будто сам подсказывает им, что творится вокруг. В темноте подземелий дварф видит дальше большинства рас."
  size: medium
  speed: 30
  traits:
    - id: darkvision
      name: Тёмное зрение
      summary: "Видит в темноте на 36 м."
      mechanical: false
    - id: dwarven_resilience
      name: Дварфийская стойкость
      summary: "Сопротивление урону ядом и преимущество на спасброски, чтобы избежать или прекратить состояние «Отравлен»."
      mechanical: true
    - id: dwarven_toughness
      name: Дварфийская выносливость
      summary: "Максимум HP растёт на 1 и ещё на 1 с каждым уровнем; на 3-м уровне это +3."
      mechanical: true
    - id: stonecunning
      name: Знание камня
      summary: "Бонусным действием даёт чувство вибрации на 18 м на 10 минут, пока дварф стоит на камне или касается его. Раз за бонус мастерства до длинного отдыха."
      mechanical: false
- id: elf
  name: Эльф
  name_en: Elf
  description: "Эльфы — долгоживущий народ, в чьих жилах течёт волшебство Страны Фей. Вместо сна они погружаются в чуткий транс, а устоять перед очарованием им легче, чем другим. Наследие дроу, высших или лесных эльфов даёт каждому свою врождённую магию, а дроу и лесным эльфам ещё и зоркость во тьме или быстрый шаг."
  size: medium
  speed: 30
  traits:
    - id: darkvision
      name: Тёмное зрение
      summary: "Видит в темноте на 18 м."
      mechanical: false
    - id: elven_lineage
      name: Эльфийское наследие
      summary: "Наследие на выбор: дроу, высший эльф или лесной эльф. Даёт заговор, особенность вроде зрения или скорости и заклинание, доступное с 3-го уровня."
      mechanical: false
    - id: fey_ancestry
      name: Наследие фей
      summary: "Преимущество на спасброски, чтобы избежать или прекратить состояние «Очарован»."
      mechanical: false
    - id: keen_senses
      name: Острые чувства
      summary: "Владение одним навыком из Проницательности, Внимательности и Выживания. В срезе всегда выдаётся Внимательность."
      mechanical: true
    - id: trance
      name: Транс
      summary: "Не нуждается во сне, магия не усыпляет эльфа. Длинный отдых занимает 4 часа медитации."
      mechanical: false
- id: gnome
  name: Гном
  name_en: Gnome
  description: "Гномы — маленький, любопытный и изобретательный народ, который обожает загадки, механизмы и розыгрыши. Их ум и волю трудно сломить, откуда бы ни шла угроза. Лесные гномы владеют иллюзиями и говорят с животными, а скальные чинят вещи и мастерят хитрые заводные игрушки."
  size: small
  speed: 30
  traits:
    - id: darkvision
      name: Тёмное зрение
      summary: "Видит в темноте на 18 м."
      mechanical: false
    - id: gnomish_cunning
      name: Гномья хитрость
      summary: "Преимущество на спасброски Интеллекта, Мудрости и Харизмы."
      mechanical: true
    - id: gnomish_lineage
      name: Гномье наследие
      summary: "Наследие на выбор: лесной гном (малая иллюзия, разговор с животными) или скальный гном (починка, фокусы, маленькие заводные устройства)."
      mechanical: false
- id: goliath
  name: Голиаф
  name_en: Goliath
  description: "Голиафы — рослые и могучие потомки великанов. Каждый носит в себе отголосок силы одного из великаньих родов: облачного, огненного, ледяного, холмового, каменного или грозового. Им легче других нести тяжёлое и вырываться из захвата."
  size: medium
  speed: 35
  traits:
    - id: giant_ancestry
      name: Происхождение от великанов
      summary: "Один дар великана на выбор, использовать его можно столько раз, каков бонус мастерства, до длинного отдыха: прыжок-телепорт, лишний урон огнём или холодом, сбивание с ног, снижение урона, ответный удар громом."
      mechanical: false
    - id: powerful_build
      name: Могучее телосложение
      summary: "Преимущество на проверки, чтобы вырваться из захвата. Для переносимого груза считается на размер больше."
      mechanical: false
- id: halfling
  name: Полурослик
  name_en: Halfling
  description: "Полурослики — маленький, весёлый и на редкость везучий народ, который ценит дом, вкусную еду и добрую компанию. Неудача словно обходит их стороной, а страх берёт над ними верх реже, чем над другими. Они умеют спрятаться за спиной того, кто крупнее, и проскользнуть у него под ногами."
  size: small
  speed: 30
  traits:
    - id: brave
      name: Храбрость
      summary: "Преимущество на спасброски, чтобы избежать или прекратить состояние «Напуган»."
      mechanical: false
    - id: halfling_nimbleness
      name: Проворство полуросликов
      summary: "Может проходить через пространство существа крупнее себя, но не может в нём остановиться."
      mechanical: false
    - id: luck
      name: Удача
      summary: "Если на к20 проверки, атаки или спасброска выпала 1, кость можно перебросить и принять новый результат."
      mechanical: true
    - id: naturally_stealthy
      name: Природная скрытность
      summary: "Может прятаться, даже если его заслоняет лишь существо хотя бы на размер крупнее."
      mechanical: false
- id: human
  name: Человек
  name_en: Human
  description: "Люди — самый многочисленный и разнообразный народ мира: живут недолго, но успевают многое. Они быстро учатся и легко приспосабливаются: каждый получает ещё один навык и черту на выбор. После длинного отдыха человек снова полон вдохновения."
  size: medium
  speed: 30
  traits:
    - id: resourceful
      name: Находчивость
      summary: "После каждого длинного отдыха человек получает вдохновение."
      mechanical: true
    - id: skillful
      name: Умелость
      summary: "Владение одним навыком на выбор."
      mechanical: true
    - id: versatile
      name: Разносторонность
      summary: "Одна черта происхождения на выбор."
      mechanical: false
- id: orc
  name: Орк
  name_en: Orc
  description: "Орки — рослые, крепкие и упорные странники и воины, известные своей выносливостью. Прилив адреналина позволяет орку рвануться вперёд и на время прибавляет ему сил, а удар, который свалил бы другого, раз за длинный отдых оставляет его на ногах. В темноте орк видит дальше большинства рас."
  size: medium
  speed: 30
  traits:
    - id: adrenaline_rush
      name: Выброс адреналина
      summary: "Рывок бонусным действием; при этом даёт временные HP, равные бонусу мастерства. Столько раз, каков бонус мастерства, между отдыхами."
      mechanical: false
    - id: darkvision
      name: Тёмное зрение
      summary: "Видит в темноте на 36 м."
      mechanical: false
    - id: relentless_endurance
      name: Неутомимость
      summary: "Если орка опустили до 0 HP, но не убили на месте, он остаётся с 1 HP. Раз за длинный отдых."
      mechanical: true
- id: tiefling
  name: Тифлинг
  name_en: Tiefling
  description: "Тифлинги несут в крови след исчадий нижних планов: демонов, дьяволов или иных тёмных сил. Это наследие видно по рогам, хвосту или необычным глазам и даёт врождённую магию и стойкость к огню, яду или некротической силе. Происхождение не решает за тифлинга: свой путь каждый выбирает сам."
  size: medium
  speed: 30
  traits:
    - id: darkvision
      name: Тёмное зрение
      summary: "Видит в темноте на 18 м."
      mechanical: false
    - id: fiendish_legacy
      name: Наследие исчадий
      summary: "Наследие на выбор: бездны, преисподней или хтоническое. Даёт сопротивление яду, огню или некротическому урону, заговор и заклинания с 3-го уровня."
      mechanical: false
    - id: otherworldly_presence
      name: Потустороннее присутствие
      summary: "Знает заговор «Чудотворство»."
      mechanical: false
