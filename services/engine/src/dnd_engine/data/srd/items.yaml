# --- зелья лечения ---
- id: potion_of_healing
  name: Зелье лечения
  name_en: Potion of Healing
  kind: potion
  heal: 2d4+2
  summary: "Красное зелье: возвращает 2к4 + 2 HP; выпить или дать союзнику рядом — действием (с модулем «Специи BG3» — бонусным)."
- id: potion_of_greater_healing
  name: Зелье большого лечения
  name_en: Potion of Greater Healing
  kind: potion
  heal: 4d4+4
  summary: "Красное зелье: возвращает 4к4 + 4 HP; выпить или дать союзнику рядом — действием (с модулем «Специи BG3» — бонусным)."

# --- снаряжение ---
- id: rope
  name: Верёвка
  name_en: Rope
  kind: gear
  summary: "Пеньковая верёвка. Узел вяжется проверкой Ловкости (Ловкость рук) Сл 10; порвать её можно проверкой Силы (Атлетика) Сл 20."
- id: torch
  name: Факел
  name_en: Torch
  kind: gear
  summary: "Горит час: яркий свет на 6 м и тусклый ещё на 6 м. Им можно ударить как простым оружием, цель получит 1 урона огнём."
- id: thieves_tools
  name: Воровские инструменты
  name_en: Thieves' Tools
  kind: gear
  summary: "Набор отмычек и щупов: открыть замок или обезвредить ловушку (Ловкость, Сл 15)."
- id: healers_kit
  name: Набор целителя
  name_en: Healer's Kit
  kind: gear
  summary: "Десять использований. Одно использование стабилизирует существо без сознания и с 0 HP без проверки Мудрости (Медицина)."
- id: spellbook
  name: Книга заклинаний
  name_en: Spellbook
  kind: gear
  summary: "Книга, в которую волшебник записывает свои заклинания."
- id: rations
  name: Рационы
  name_en: Rations
  kind: gear
  summary: "Дорожная еда на день: вяленое мясо, сухофрукты, сухари, орехи."

# --- фокусировки ---
- id: holy_symbol
  name: Священный символ
  name_en: Holy Symbol
  kind: focus
  summary: "Эмблема божества: жрец использует её как фокусировку для заклинаний."
- id: arcane_focus
  name: Магическая фокусировка
