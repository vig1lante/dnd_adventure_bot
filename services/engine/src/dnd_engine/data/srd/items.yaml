# --- доспехи и щит ---
- id: leather_armor
  name: Кожаный доспех
  name_en: Leather Armor
  kind: armor
  armor:
    kind: light
    base_ac: 11
    dex_cap: null
  summary: "Лёгкий доспех: КД 11 + Лов."
- id: studded_leather_armor
  name: Проклёпанный кожаный доспех
  name_en: Studded Leather Armor
  kind: armor
  armor:
    kind: light
    base_ac: 12
    dex_cap: null
  summary: "Лёгкий доспех: КД 12 + Лов."
- id: chain_shirt
  name: Кольчужная рубаха
  name_en: Chain Shirt
  kind: armor
  armor:
    kind: medium
    base_ac: 13
    dex_cap: 2
  summary: "Средний доспех: КД 13 + Лов (не больше +2)."
- id: scale_mail
  name: Чешуйчатый доспех
  name_en: Scale Mail
  kind: armor
  armor:
    kind: medium
