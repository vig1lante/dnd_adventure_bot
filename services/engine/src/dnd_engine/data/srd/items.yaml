# Предметы SRD 5.2.1 (CC BY 4.0): оружие и доспехи стартовых наборов и монстров, зелья лечения
# и снаряжение. Краткий пересказ своими словами, не копия текста.
#
# Соглашения:
# - Оружие. Урон записан для одной руки; двуручный хват универсального оружия (versatile)
#   описан в summary. Метательное и универсальное оружие ближнего боя имеет range: melee и
#   свойство thrown; луки и арбалеты — range: far. Свойства: finesse, light, thrown, two_handed,
#   versatile, heavy, reach, ammunition (заряжание и свойства мастерства оружия не переносятся).
# - Доспехи. base_ac — КД в доспехе; к нему прибавляется модификатор Ловкости, но не больше
#   dex_cap (null — без предела, 0 — Ловкость не прибавляется: тяжёлый доспех). У щита base_ac —
#   бонус к КД. Требование Силы кольчуги (13) движок не учитывает.
# - Зелья лечения: своё или существа в пределах 1,5 м. Движок тратит на них действие;
#   бонусным его делает только модуль «Специи BG3» (спека DND-1, §5.5).
# - Предметы без механики (kind: gear, focus) нужны для инвентаря и рассказа мастера.

# --- простое оружие ближнего боя ---
- id: club
  name: Дубинка
  name_en: Club
  kind: weapon
  weapon:
    category: simple
    damage: 1d4
    damage_type: bludgeoning
    properties: [light]
    range: melee
  summary: "Лёгкая деревянная дубинка."
- id: dagger
  name: Кинжал
  name_en: Dagger
  kind: weapon
  weapon:
    category: simple
    damage: 1d4
    damage_type: piercing
    properties: [finesse, light, thrown]
    range: melee
  summary: "Лёгкий фехтовальный клинок; его можно метнуть на 6/18 м."
- id: quarterstaff
  name: Боевой посох
  name_en: Quarterstaff
  kind: weapon
  weapon:
    category: simple
    damage: 1d6
    damage_type: bludgeoning
    properties: [versatile]
    range: melee
  summary: "Длинный шест. Двумя руками наносит 1к8 урона."
- id: mace
  name: Булава
  name_en: Mace
  kind: weapon
  weapon:
    category: simple
    damage: 1d6
    damage_type: bludgeoning
    properties: []
    range: melee
  summary: "Тяжёлая дробящая булава, оружие жрецов."
- id: spear
  name: Копьё
  name_en: Spear
  kind: weapon
  weapon:
    category: simple
    damage: 1d6
    damage_type: piercing
    properties: [thrown, versatile]
    range: melee
  summary: "Метательное копьё (6/18 м). Двумя руками наносит 1к8 урона."
- id: handaxe
  name: Ручной топор
  name_en: Handaxe
  kind: weapon
  weapon:
    category: simple
    damage: 1d6
    damage_type: slashing
    properties: [light, thrown]
    range: melee
  summary: "Лёгкий топорик; его можно метнуть на 6/18 м."
- id: javelin
  name: Метательное копьё
  name_en: Javelin
  kind: weapon
  weapon:
    category: simple
    damage: 1d6
    damage_type: piercing
    properties: [thrown]
    range: melee
  summary: "Копьё для метания на 9/36 м, в ближнем бою тоже годится."

