id: cemetery
name: Кладбище Мшистого Брода
region: Холм за деревней
read_aloud: >-
  Ржавые ворота жалуются на жизнь долгим скрипом. За ними рядами уходят покосившиеся
  кресты, туман стелется по колено, а в стороне горит тусклое окошко сторожки. Где-то
  в тумане негромко стучит то ли ветка, то ли кость.
dm_notes: >-
  Бой «Встающие кости» начинается, когда отряд идёт вглубь кладбища от ворот или шумит
  у сторожки: остатки ритуала Фабиана поднимают мертвецов из ближних могил. В сторожке
  лежит дневник Ульриха, а у стены стоит запертый сундук; запасной ключ есть у Марты.
  Люк в склеп спрятан под мшистой плитой у дальней стены. Следы волочения ведут прямо к
  ней, поэтому плиту находят и тем, кто идёт по следам, и тем, кто ищет сам.
exits:
  - id: to-village
    to: village
    direction: юг
    description: Тропа обратно в деревню.
  - id: to-crypt
    to: crypt
    direction: вниз
    description: Под мшистой плитой у дальней стены начинается каменная лестница в склеп.
    hidden_dc: 15
features:
  - id: diary
    name: Дневник смотрителя
    description: >-
      На столе в сторожке лежит дневник Ульриха, исписанный торопливым почерком.
      Последние записи: «Фабиан опять приходил к плите графа Мортена. Говорит, что должен
      моей сестре сорок золотых и вернёт их с процентами и поклоном. Просил показать, как
      поднимается плита. Я отказал. Он обещал вернуться с аргументами».
    check:
      ability: int
      skill: investigation
      dc: 10
    reveals:
      - kind: clue
        id: clue-diary
  - id: chest
    name: Сундук смотрителя
    description: >-
      У стены сторожки стоит тяжёлый сундук, окованный железом. Замок на нём размером с
      кулак и явно дороже всего, что может лежать внутри. Внутри, если верить звону,
      что-то стеклянное.
    locked_by: item:chest-key
    reveals:
      - kind: item
        id: healing-potion
  - id: tracks
    name: Следы волочения
    description: >-
      От сторожки к дальней стене тянутся две глубокие борозды, будто кого-то тащили за
      ноги и не слишком церемонились. Рядом отпечатки башмаков с очень стоптанными
      каблуками и лужица пролитого пива.
    check:
      ability: wis
      skill: survival
      dc: 10
    reveals:
      - kind: clue
        id: clue-tracks
      - kind: exit
        id: to-crypt
encounter_id: risen-bones
zones:
  - id: gate
    name: у ворот
  - id: graves
    name: среди могил
  - id: lodge
    name: у сторожки
links:
  - a: gate
    b: graves
    distance: near
  - a: graves
    b: lodge
    distance: near
