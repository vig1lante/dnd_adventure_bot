id: fabian
name: Фабиан
role: некромант-неудачник
appearance: >-
  Тощий человек лет тридцати в чёрном плаще с чужого плеча. Рукава коротки, капюшон
  велик, на носу следы мела.
manner: >-
  Тараторит, оправдывается и важничает одновременно, а когда нервничает, путает
  заклинания с рецептами. Стоит заговорить про деньги, и он бледнеет.
motive: >-
  Раздобыть клад графа Мортена и наконец вернуть долг Марте, чтобы она видела в нём мага,
  а не должника.
secret: >-
  Он не умеет сам поднять плиту и держит смотрителя Ульриха в склепе «консультантом». Весь
  его долг составляет сорок золотых за комнату и пироги, и Фабиану стыдно, что из-за такой
  мелочи он стал похитителем. Клада в склепе, скорее всего, нет.
knows:
  - Что смотритель жив и сидит в саркофаге у алтаря.
  - Что меловой круг он чертил сам и немного напутал с рунами.
  - Что долг перед Мартой равен сорока золотым и растёт с каждым пирогом.
  - Легенду о том, что граф Мортен велел похоронить с собой всё золото.
attitude: -1
relations:
  - npc_id: marta
    kind: creditor
    note: Марта — его кредитор, ей он должен сорок золотых.
location_id: crypt
statblock: cultist_fanatic
