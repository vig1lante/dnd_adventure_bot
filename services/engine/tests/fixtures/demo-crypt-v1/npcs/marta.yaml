id: marta
name: Марта
role: трактирщица «Сонного покойника», сестра пропавшего смотрителя
appearance: >-
  Рослая женщина с сильными руками и в фартуке, который пережил больше драк, чем иной
  рыцарь. Под глазами тёмные круги: она не спала три ночи.
manner: >-
  Говорит громко и по делу, шутит сквозь зубы, когда ей страшно. Не выносит жалости и
  пустых слов, зато любит, когда съедают всё, что она подала.
motive: >-
  Вернуть брата Ульриха живым и заодно выбить из Фабиана долг, пока тот совсем не
  обнаглел.
secret: >-
  Это она сказала Фабиану искать работу на кладбище, лишь бы он убрался из трактира, и теперь
  винит себя в том, что с братом случилось.
knows:
  - Ульрих ушёл на обход кладбища три ночи назад и не вернулся.
  - Фабиан задолжал ей сорок золотых и на днях хвастался, что скоро рассчитается с
    процентами и поклоном.
  - Фабиан исчез в ту же ночь, что и Ульрих.
  - У неё есть запасной ключ от сундука брата в сторожке.
attitude: 0
relations:
  - npc_id: fabian
    kind: debtor
    note: Фабиан должен ей сорок золотых за комнату и ужины.
location_id: village
